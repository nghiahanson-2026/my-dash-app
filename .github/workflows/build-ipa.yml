name: build-ipa
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Vector tests first. A red run here means: do NOT ride, and there is no .ipa to install.
      - name: Vector tests (DashProtocol)
        working-directory: Packages/DashProtocol
        run: swift test

      # 2. Generate the Xcode project from project.yml.
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate

      # 3. Build an unsigned app; Sideloadly signs it with your Apple ID.
      - name: Build unsigned app
        run: |
          xcodebuild -project MyDash.xcodeproj -scheme MyDash -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MyDash.app Payload/
          zip -qr MyDash.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MyDash-ipa
          path: MyDash.ipa
